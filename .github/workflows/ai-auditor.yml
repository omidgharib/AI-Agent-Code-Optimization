name: AI Auditor Quality Gate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: node dist/cli/index.js audit . --changed-only --max-critical 0 --sarif --json
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ai-auditor-report
